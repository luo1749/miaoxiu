<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>苗绣服饰 3D 预览</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.4.0/dist/model-viewer.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #0B0E14; }
    model-viewer { width: 100vw; height: 100vh; }
    .info {
      position: absolute; top: 16px; left: 16px;
      color: #F0EDE0; font-family: sans-serif;
      background: rgba(0,0,0,0.5); padding: 12px 16px; border-radius: 8px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <model-viewer
    src="models/miao-garment.glb"
    alt="苗绣服饰 3D 模型"
    auto-rotate
    camera-controls
    touch-action="pan-y"
    exposure="1.0"
    shadow-intensity="1"
    ar
    ar-modes="webxr scene-viewer quick-look"
    environment-image="neutral"
  ></model-viewer>
  <div class="info">
    <h3 style="margin:0 0 4px 0">苗绣服饰 WebAR 预览</h3>
    <p style="margin:0; font-size:12px; opacity:0.8">拖拽旋转 · 滚轮缩放 · 点击 AR 按钮体验</p>
  </div>
</body>
</html>
